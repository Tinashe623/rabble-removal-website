<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Disabled</title>
  <style>
    body {
      filter: grayscale(100%);
      -webkit-filter: grayscale(100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    .message {
      text-align: center;
      padding: 20px;
      background: rgba(255,255,255,0.8);
      border-radius: 8px;
      max-width: 80%;
    }
    h1 { color: #333; }
    p { color: #555; }
  </style>
</head>
<body>
  <div class="message">
    <h1>Site Disabled</h1>
    <p>This site is currently disabled due to inactivity.</p>
    <p>Please contact the developer for more information.</p>
  </div>
</body>
</html>
